<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the layout extends under the notch and system bars, and
         the CSS recovers the edges with env(safe-area-inset-*).
         interactive-widget=overlays-content: the keyboard covers the page instead of
         squeezing it, so the fixed chrome does not jump; whatever must stay above the
         keyboard uses --rk-app-vh (see lib/viewportMetrics.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#0a0e14" />
    <!-- Media URLs may carry the hub access key (`accessKey=`): never send them as
         Referer. The hub sets the same policy as a header, but the Tauri shells load
         this page from the app itself, where only this tag applies. -->
    <meta name="referrer" content="no-referrer" />
    <title>RE-KORD</title>
    <meta name="description" content="RE-KORD — la tua musica, dal tuo hub." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- PWA: only the client served by the hub uses it (see src/lib/platform/pwa.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- No Google Fonts: the hub and the native shells must work without
         Internet (and Tauri's CSP would not allow it). Inter and
         JetBrains Mono ship with the package (packages/ui/src/styles/fonts.css);
         here we only preload Latin Inter, the only file needed for first paint. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../../packages/ui/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
