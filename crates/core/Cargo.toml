[package]
name = "rekord-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RE-KORD server core: SQLite, scan, API, media"

[dependencies]
rekord-plugin-api = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
http-range-header = { workspace = true }
http-body = "1"
lofty = { workspace = true }
mime_guess = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip", "compression-br"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
tokio-stream = { workspace = true }
notify = { workspace = true }
image = { workspace = true }
libc = "0.2"
regex = "1"
sha2 = "0.10"
# Constant-time comparison of the access key (already in the lockfile).
subtle = "2"
if-addrs = "0.13"

[dev-dependencies]
# Paused time for the sleep-prevention timer tests.
tokio = { workspace = true, features = ["test-util"] }
