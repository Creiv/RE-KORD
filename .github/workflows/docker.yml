# Builds the hub image for amd64 and arm64 and publishes it to the GitHub
# Container Registry (ghcr.io/creiv/re-kord), used by docker-compose.yml.
#
# Runs when a GitHub release becomes a full release (published as one, or a
# pre-release promoted), plus a manual run from the Actions tab (e.g. to
# publish an image for an older tag). Pre-releases (client previews) never
# move :latest. The arm64 half is built under QEMU, which is slow: hence not
# on every push.

name: Build Docker Image

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
