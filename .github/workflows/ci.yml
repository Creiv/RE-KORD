name: CI

# RE-KORD: Rust hub, Svelte client and admin panel, Tauri shells (desktop + Android).

on:
  push:
    branches: [main, next/tauri-hub]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly dependency audit (Monday 06:00 UTC), even without pushes.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: "22"

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/version.mjs check

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg (transcode / preview tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: cargo fmt
        run: cargo fmt --all --check
      # The Tauri shell (rekord-client) needs webkit2gtk: the tauri-linux job
      # checks it, so it is left out here.
      - name: cargo clippy
        run: cargo clippy --workspace --exclude rekord-client --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --exclude rekord-client --locked

  web:
    name: Web UI (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present check
      - run: pnpm -r --if-present test
      - run: pnpm build:ui
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: |
            apps/client-ui/dist
            apps/server-ui/dist
          retention-days: 7

  tauri-linux:
    name: Tauri desktop (Linux)
    runs-on: ubuntu-22.04
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev libsoup-3.0-dev \
            patchelf file build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-linux
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: clippy (client shell, with and without the embedded hub)
        run: |
          pnpm build:ui
          cargo clippy -p rekord-client --locked -- -D warnings
          cargo clippy -p rekord-client --features hub --locked -- -D warnings
      - name: Bundle (deb)
        run: pnpm --filter @rekord/client-shell exec tauri build --bundles deb
      - uses: actions/upload-artifact@v7
        with:
          name: rekord-client-linux-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 7

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    needs: [web]
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK (ANDROID_HOME) with current
      # cmdline-tools; setup-android's pinned tools broke `sdkmanager --licenses`.
      - name: NDK + platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build debug APK (arm64)
        run: pnpm android:build
      - uses: actions/upload-artifact@v7
        with:
          name: rekord-client-android-debug
          path: apps/client-shell/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: a new RUSTSEC or npm advisory must not block a fix from landing;
    # the job turns red so it gets looked at.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit --deny warnings
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level moderate

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rekord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
