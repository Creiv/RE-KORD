<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: il layout arriva sotto tacca e barre di sistema, e i
         bordi li recupera il CSS con env(safe-area-inset-*).
         interactive-widget=overlays-content: la tastiera copre la pagina invece di
         schiacciarla, così la cromatura fissa non salta; chi deve stare sopra la
         tastiera usa --rk-app-vh (vedi lib/viewportMetrics.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#0a0e14" />
    <title>RE-KORD 5.1.0</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/REKORDlogo.png" />
    <link rel="apple-touch-icon" href="/REKORDlogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
